services:
  - type: web
    name: weather-records
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: weather_db
      - key: MONGODB_COLLECTION
        value: weather_readings
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ENTRA_TENANT_ID
        value: 1a5409a9-a179-4efe-a26b-5a9ac72f1b37
      - key: ENTRA_CLIENT_ID
        value: adc565a4-9141-4e09-90b6-3704d6a4b87a
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_REDIRECT_URI
        sync: false
