services:
  - type: web
    name: weather-records
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: weather_db
      - key: MONGODB_COLLECTION
        value: weather_readings
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_REDIRECT_URI
        sync: false
